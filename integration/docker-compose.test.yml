# Integration test harness (testing-strategy.md §2). Brings up the real
# app + postfix images (same Dockerfiles as production) plus a controlled
# upstream-stub SMTP server, all on an isolated network reachable from the
# host at fixed ports so pytest (run on the host, or in a CI job) can drive
# real SMTP sessions and real API calls.
#
# Run from the repo root:
#   docker compose -f integration/docker-compose.test.yml up -d --build
#   pip install -r integration/requirements.txt
#   pytest integration/
#   docker compose -f integration/docker-compose.test.yml down -v

services:
  app:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    volumes:
      - control_socket_test:/shared-config:ro
      - upstream_ca_test:/upstream-ca:ro
    environment:
      RELAY_DATABASE_URL: sqlite:////data/app.db
      RELAY_COOKIE_SECURE: "false"
      # Fixed, test-only key — base64(b"0" * 32). Never use a fixed key
      # outside this throwaway test harness.
      RELAY_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      RELAY_POSTFIX_CONTROL_SOCKET: /shared-config/control.sock
      RELAY_SUBMISSION_HOST: relay-test.internal
      # Trust the upstream stub's self-signed certificate (published by the
      # stub into upstream_ca_test) the way a real deployment trusts a
      # public CA, so the suite exercises verified upstream TLS (#153).
      RELAY_UPSTREAM_TLS_CA_FILE: /upstream-ca/stub.crt
    ports:
      - "8000:8000"
    depends_on:
      - postfix

  postfix:
    build:
      context: ../postfix
    volumes:
      - relay_config_test:/etc/postfix/relay
      - control_socket_test:/run/relay-control
      # Same fix as production's docker-compose.yml (issue #118) — without
      # this, test_local_user_password_survives_postfix_container_recreation
      # would correctly fail, since the underlying persistence, not just
      # the code path, is what's actually being tested here.
      - sasldb_test:/var/lib/postfix-sasldb
      # Same fix as production's docker-compose.yml (issue #121) — same
      # reasoning: the new queue-persistence regression test needs the
      # real volume-backed behavior, not just the code path, to actually
      # prove anything.
      - postfix_queue_test:/var/spool/postfix
      # Same as production's docker-compose.yml (#228): the maillog that
      # mail-log ingestion reads must survive container recreation.
      - postfix_log_test:/var/log/postfix
      - upstream_ca_test:/upstream-ca:ro
    environment:
      RELAY_SUBMISSION_HOST: relay-test.internal
    ports:
      - "1587:587" # submission — what the test suite's SMTP clients connect to
      - "1025:25" # plain smtp — used only by the open-relay-prevention test

  upstream-stub:
    build:
      context: ./upstream_stub
    volumes:
      - upstream_ca_test:/upstream-ca
    networks:
      default:
        # Same server, reached under a name its certificate doesn't cover —
        # for the hostname-verification tests (#153).
        aliases:
          - upstream-stub-mismatch
    ports:
      - "2526:2526" # inspection HTTP API for the test suite

volumes:
  relay_config_test:
  control_socket_test:
  sasldb_test:
  postfix_queue_test:
  postfix_log_test:
  upstream_ca_test:
