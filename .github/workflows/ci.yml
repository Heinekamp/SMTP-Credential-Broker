name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d --wait
      - run: curl --fail http://localhost:8000/api/health
      - run: docker compose logs postfix
      - if: always()
        run: docker compose down -v

  integration:
    # The mandatory spec §25 suite (testing-strategy.md §2) — real SMTP
    # sessions against the real postfix image, not a mock. See
    # integration/README.md for what this has already caught; don't
    # downgrade this to compose-smoke's shallow health check.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r integration/requirements.txt
      - run: docker compose -f integration/docker-compose.test.yml up -d --build --wait
      - run: pytest integration/ -v
      - if: always()
        run: docker compose -f integration/docker-compose.test.yml logs
      - if: always()
        run: docker compose -f integration/docker-compose.test.yml down -v
