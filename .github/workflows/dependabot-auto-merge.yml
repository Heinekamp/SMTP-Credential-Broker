name: Dependabot auto-merge

# pull_request_target (not pull_request): Dependabot PRs run with a
# read-only GITHUB_TOKEN under the plain `pull_request` event (a GitHub
# security restriction on Dependabot specifically), which can't merge
# anything. This event runs in the base repo's context instead, so the
# token here has the write permissions the merge step below needs — see
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Requires "Allow auto-merge" enabled on the repo and branch
      # protection on main requiring this CI's jobs as status checks —
      # otherwise this either has nothing to attach to, or merges
      # immediately without actually waiting for CI (see #69). This only
      # *requests* auto-merge; the actual merge happens once those
      # required checks pass.
      #
      # Excludes package-ecosystem "docker": a floating base-image tag
      # like python:3.12-slim -> 3.14-slim reads as a "minor" bump to
      # fetch-metadata (same leading version component), but a Python/
      # Node/Debian minor release is not a safe drop-in the way an actual
      # semver-minor library release is — this is exactly how #70 broke
      # the integration test image's asyncio usage and merged straight to
      # main before anyone looked at it. Docker updates always get a
      # plain PR now, regardless of update-type.
      - name: Enable auto-merge for patch/minor updates
        if: |
          steps.metadata.outputs.package-ecosystem != 'docker' && (
            steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
            steps.metadata.outputs.update-type == 'version-update:semver-minor'
          )
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
