services:
  app:
    # Naming this alongside `build:` is what makes `docker compose pull`
    # (docs/upgrading.md) a real alternative to `--build`: with both
    # present, `build`/`up --build` still build and tag locally as before
    # (published-image publishing, on a GitHub Release, is
    # .github/workflows/publish-images.yml — issue #38), while `pull`
    # fetches this name from GHCR instead. RELAY_IMAGE_TAG defaults to
    # `latest`; only published releases publish tags, never `main` itself.
    image: ghcr.io/heinekamp/smtp-credential-broker/app:${RELAY_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    volumes:
      - app_data:/data
      # Read-only from app's side: the control socket lives here (app
      # connects to it), but app never writes files here directly — every
      # config/sasldb2 mutation goes through the control surface RPC
      # (security-model.md §6), enforced in code and, defense-in-depth,
      # by this mount flag.
      - relay_config:/shared-config:ro
    ports:
      # Host-side port only — override via APP_HOST_PORT (.env) if 8000 is
      # already taken by something else on the host (e.g. Portainer).
      # Compose concatenates rather than replaces `ports` across an
      # override file, so this can't be fixed with a
      # docker-compose.override.yml the way other host-specific settings
      # are — it has to be a variable in the base file itself.
      - "${APP_HOST_PORT:-8000}:8000"
    environment:
      RELAY_DATABASE_URL: sqlite:////data/app.db
      RELAY_COOKIE_SECURE: "true"
      RELAY_POSTFIX_CONTROL_SOCKET: /shared-config/control.sock
      RELAY_SUBMISSION_HOST: ${RELAY_SUBMISSION_HOST:-smtp-relay.internal}
      # From the shell environment or a .env file next to this file — see
      # .env.example. Never given a value here directly.
      RELAY_ENCRYPTION_KEY: ${RELAY_ENCRYPTION_KEY:-}
      RELAY_ENCRYPTION_KEY_FILE: ${RELAY_ENCRYPTION_KEY_FILE:-}
    depends_on:
      - postfix
    # A real capability check (architecture.md §7's own health endpoint),
    # not just "the process is up" — python3 rather than curl since the
    # base image doesn't otherwise need curl installed.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  postfix:
    image: ghcr.io/heinekamp/smtp-credential-broker/postfix:${RELAY_IMAGE_TAG:-latest}
    build:
      context: ./postfix
    restart: unless-stopped
    volumes:
      - relay_config:/etc/postfix/relay
      # Overwrite with a real certificate/key for anything beyond local
      # testing — see docs/installation.md's TLS section. Left as a named
      # volume (not a bind mount) so a fresh deployment still works out of
      # the box: Docker seeds it from the image's baked-in self-signed
      # placeholder (postfix/Dockerfile) on first start.
      - postfix_tls:/etc/postfix/tls
    environment:
      # Must match app's RELAY_SUBMISSION_HOST exactly — it's the SASL
      # realm saslpasswd2 stores credentials under, and has to agree with
      # main.cf's myhostname (smtpd_sasl_local_domain is empty, so Postfix
      # falls back to $myhostname as the realm — postfix-architecture.md §5).
      RELAY_SUBMISSION_HOST: ${RELAY_SUBMISSION_HOST:-smtp-relay.internal}
    ports:
      - "587:587"
    # postfix genuinely isn't running yet on a brand-new deployment until
    # the app container's entrypoint successfully pushes the first
    # generated config (postfix-architecture.md §7 — nothing else starts
    # it) — a generous start_period avoids a false "unhealthy" flap on
    # first boot rather than reporting a real problem.
    healthcheck:
      test: ["CMD", "postfix", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  app_data:
  relay_config:
  postfix_tls:
