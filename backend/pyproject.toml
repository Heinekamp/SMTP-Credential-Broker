[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relay"
version = "0.3.0"
description = "Managed SMTP Relay administration application"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.15.0",
    "email-validator>=2.1",
    "argon2-cffi>=23.1",
    "cryptography>=42.0",
    "jinja2>=3.1",
    "typer>=0.12",
    "pyotp>=2.9",
    "requests>=2.31",
    "acme>=2.9",
    "dnspython>=2.6",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "time-machine>=2.14",
    "ruff>=0.5",
]
# Only used by scripts/screenshots/ (README screenshot regeneration) —
# never needed to run or test the app itself, so kept out of `dev`.
screenshots = [
    "playwright>=1.47",
    "pillow>=12.3.0",
]

[project.scripts]
relay = "app.cli:cli"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"
# Alembic autogenerates these; they're reviewed for correctness, not hand
# formatted, and re-running autogenerate would just reformat them again.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# conftest.py deliberately sets env vars before importing app.* so the
# lru_cache'd Settings picks them up on first call — E402 is expected there.
per-file-ignores = { "tests/conftest.py" = ["E402"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
