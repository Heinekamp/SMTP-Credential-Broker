[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os

# sqlalchemy.url is intentionally omitted here — alembic/env.py reads the
# real value from app.config.Settings (RELAY_DATABASE_URL), so migrations
# always run against whatever the app itself is configured to use rather
# than a value that could drift out of sync with it.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
